# =============================================================================
# Yocto build matrix. Runs on dedicated, autoscaled runners tagged `yocto`
# with a persistent /cache volume (sstate + downloads stay warm per host).
# =============================================================================

.kas-build:
  stage: build
  image: $BUILDER_IMAGE
  tags: [yocto]
  extends: [.yocto-caches]
  timeout: 4h
  # Never run two writers against the same machine's sstate publish
  resource_group: sstate-publish-$MACHINE
  variables:
    KAS_WORK_DIR: "$CI_PROJECT_DIR"
    KAS_BUILD_DIR: "$CI_PROJECT_DIR/build"
    KAS_REPO_REF_DIR: "$CI_PROJECT_DIR/.cache/kas-repos"
    SLP_CVE_DB_DIR: "$CI_PROJECT_DIR/.cache/cve-db"
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - !reference [.cache-policy-rules, rules]
  before_script:
    - source ci/scripts/cache-env.sh          # RO vs RW cache mode, GPG import
  script:
    - kas build "kas/machines/${MACHINE}.yml:${KAS_OVERLAYS}${EXTRA_OVERLAYS}"
        2>&1 | tee build.log; test "${PIPESTATUS[0]}" -eq 0
    - python3 ci/scripts/cache_stats.py build.log --machine "$MACHINE"
        --metrics metrics.txt --json cache-stats-${MACHINE}.json
    - ci/scripts/collect-artifacts.sh "$MACHINE" out/
  after_script:
    # Publish only from protected refs; runs even if tests later fail so
    # the next pipeline benefits from what this one already compiled.
    - ci/scripts/sstate-publish.sh
  artifacts:
    when: always
    expire_in: 2 weeks
    name: "secure-linux-${MACHINE}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - out/
      - build.log
      - cache-stats-${MACHINE}.json
    reports:
      metrics: metrics.txt

# MR pipelines: read-only caches, no signing key available.
# Protected refs: read-write caches, sstate objects GPG-signed and published.
build:
  extends: .kas-build
  parallel:
    matrix:
      - MACHINE: [qemux86-64, qemuarm64]
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        CACHE_POLICY: "pull-push"
        EXTRA_OVERLAYS: ":kas/features/sstate-sign.yml"
    - when: on_success
      variables:
        CACHE_POLICY: "pull"
        EXTRA_OVERLAYS: ""

# Test image (root login enabled) is a separate build target and never shipped
build:test-image:
  extends: .kas-build
  variables:
    MACHINE: qemux86-64
    EXTRA_OVERLAYS: ":kas/features/test.yml"
  resource_group: null
  after_script: []
