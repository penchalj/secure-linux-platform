# =============================================================================
# Secure Linux Platform - CI backbone (milestone v0.2)
#
# Runs on the self-hosted runner tagged `yocto` (Ubuntu build VM).
# Persistent caches on the runner host (/srv/yocto/cache -> /cache/yocto):
#   downloads/    DL_DIR      (fetched sources, Yocto mirror first)
#   sstate-cache/ SSTATE_DIR  (shared state + hash-equivalence DB)
#   ci/           kas work dir (layer checkouts) and build dirs
#
# The complete target pipeline (lint, security gates, signing, release)
# lives in ci/target-pipeline.gitlab-ci.yml and is enabled per milestone.
# =============================================================================

stages:
  - lint
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true
  tags: [yocto]

variables:
  KAS_IMAGE: "ghcr.io/siemens/kas/kas:5.5"

lint:yaml:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --quiet --no-cache-dir yamllint
    - yamllint -c .yamllint kas/ .gitlab-ci.yml

build:qemux86-64:
  stage: build
  image:
    name: $KAS_IMAGE
    # Bypass the kas container entrypoint (built for `docker run`, not for
    # GitLab's shell executor) and start as root to map the build user
    entrypoint: [""]
    docker:
      user: root
  timeout: 8h
  needs: [lint:yaml]
  variables:
    MACHINE: qemux86-64
    BUILD_UID: "1000"     # owner of /srv/yocto/cache on the runner host
    DL_DIR: /cache/yocto/downloads
    SSTATE_DIR: /cache/yocto/sstate-cache
    KAS_WORK_DIR: /cache/yocto/ci/work
    KAS_BUILD_DIR: /cache/yocto/ci/build-qemux86-64
    # v0.3: shared read-only mirror + hashserv/prserv (docker network yocto-cache)
    KAS_FEATURES: "kas/features/local-vm.yml:kas/features/ci-mirror.yml"
  script:
    # Map the image's "builder" user to the cache owner, then drop root
    - groupmod -o -g "$BUILD_UID" "$(id -gn builder)"
    - usermod -o -u "$BUILD_UID" builder
    - chown -R builder:"$(id -gn builder)" /builder "$CI_PROJECT_DIR"
    - runuser -u builder -- env HOME=/builder ci/scripts/ci-build.sh
  artifacts:
    when: always
    expire_in: 4 weeks
    paths:
      - build.log
      - cache-stats-*.json
      - images-*.txt
      - "*.rootfs.spdx.json"
      - "*.rootfs.manifest"
    reports:
      metrics: metrics.txt

# Simulates a brand-new runner: EMPTY local DL_DIR/SSTATE_DIR, so every object
# must come from the shared read-only mirror. Manual - used for benchmarks.
build:fresh-runner:
  extends: build:qemux86-64
  variables:
    FRESH_RUNNER: "1"
    DL_DIR: /cache/yocto/ci/fresh/downloads
    SSTATE_DIR: /cache/yocto/ci/fresh/sstate-cache
    KAS_BUILD_DIR: /cache/yocto/ci/build-fresh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
