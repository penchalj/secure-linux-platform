# =============================================================================
# Secure Linux Platform - CI backbone (milestone v0.2)
#
# Runs on the self-hosted runner tagged `yocto` (Ubuntu build VM).
# Persistent caches on the runner host (/srv/yocto/cache -> /cache/yocto):
#   downloads/    DL_DIR      (fetched sources, Yocto mirror first)
#   sstate-cache/ SSTATE_DIR  (shared state + hash-equivalence DB)
#   ci/           kas work dir (layer checkouts) and build dirs
#
# The complete target pipeline (lint, security gates, signing, release)
# lives in ci/target-pipeline.gitlab-ci.yml and is enabled per milestone.
# =============================================================================

include:
  - template: Jobs/SAST.gitlab-ci.yml

stages:
  - lint
  - build
  - publish

# Trust boundary (cache-poisoning protection, v0.3 step 3):
#   protected refs (main, release tags) -> runner "yocto"  (trusted cache
#                                          volume, publish credentials)
#   everything else (MRs, feature branches) -> runner "yocto-untrusted"
#                                          (own throw-away volume, mirror
#                                          read-only over HTTP)
# The trusted runner is additionally marked "Protected" in GitLab, so it
# refuses jobs from unprotected refs even if a job asks for its tag.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        RUNNER_TAG: yocto-untrusted
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        RUNNER_TAG: yocto
    # Feature branches build ONLY through their merge request: a plain push
    # (e.g. `git push -o merge_request.create`) would otherwise start a second,
    # duplicate branch pipeline. Manual runs from the UI stay possible.
    - if: $CI_PIPELINE_SOURCE == "web"
      variables:
        RUNNER_TAG: yocto-untrusted

default:
  interruptible: true
  tags: [$RUNNER_TAG]

variables:
  KAS_IMAGE: "ghcr.io/siemens/kas/kas:5.5"
  # v0.4 lint toolchain - pinned versions (Renovate bumps them)
  SHELLCHECK_IMAGE: "koalaman/shellcheck-alpine:v0.11.0"
  HADOLINT_IMAGE: "hadolint/hadolint:v2.15.1-alpine"
  GITLEAKS_IMAGE: "zricethezav/gitleaks:v8.30.1"
  OELINT_VERSION: "8.2.2"
  RCLONE_IMAGE: "rclone/rclone:1.76.0"

# ---------------------------------------------------------------------------
# Shift-left gates (v0.4): seconds, before any runner-hour goes into bitbake.
# Blocking: yaml, shell (warning+), Dockerfile (warning+), recipes (error),
# kernel hardening policy, secrets. SAST (Semgrep) reports only.
# ---------------------------------------------------------------------------
.lint:
  stage: lint
  needs: []

lint:yaml:
  extends: .lint
  image: python:3.12-slim
  script:
    - pip install --quiet --no-cache-dir "yamllint==1.*" "check-jsonschema==0.39.0"
    - yamllint -c .yamllint kas/ .gitlab-ci.yml
    # Valid YAML is not enough: validate against the GitLab CI schema
    # (catches e.g. "key: value" parsed as a mapping inside script:)
    - check-jsonschema --builtin-schema vendor.gitlab-ci .gitlab-ci.yml

lint:shell:
  extends: .lint
  image: $SHELLCHECK_IMAGE
  script:
    - shellcheck --version | grep '^version'
    - shellcheck -x --severity=warning ci/scripts/*.sh infra/cache/*.sh scripts/*.sh

lint:dockerfile:
  extends: .lint
  image:
    name: $HADOLINT_IMAGE
    entrypoint: [""]
  script:
    - hadolint --format gitlab_codeclimate docker/Dockerfile > gl-code-quality-hadolint.json || true
    - hadolint --failure-threshold warning docker/Dockerfile
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-hadolint.json

lint:recipes:
  extends: .lint
  image: python:3.12-slim
  script:
    - pip install --quiet --no-cache-dir "oelint-adv==$OELINT_VERSION"
    # oelint-adv does not know "wrynose" yet: "latest" = newest rule set
    - oelint-adv --release latest --quiet --relpaths
        --messageformat "{path}:{line}:{severity}:{id}:{msg}"
        $(find meta-secure-linux -name '*.bb' -o -name '*.bbappend') > oelint.txt 2>&1 || true
    - cat oelint.txt
    - python3 ci/scripts/oelint_to_codequality.py oelint.txt > gl-code-quality-oelint.json
    - echo "oelint errors=$(grep -c ':error:' oelint.txt || true)"
    - "! grep -q ':error:' oelint.txt"
  artifacts:
    when: always
    paths: [oelint.txt]
    reports:
      codequality: gl-code-quality-oelint.json

lint:kernel-hardening:
  extends: .lint
  image: python:3.12-slim
  script:
    - pip install --quiet --no-cache-dir "PyYAML==6.*"
    - python3 ci/scripts/check_kconfig.py
        meta-secure-linux/recipes-kernel/linux/files/secure-linux-kmeta/features/secure-linux/hardening.cfg
        --policy ci/policies/kconfig-required.yml

secrets:gitleaks:
  extends: .lint
  image:
    name: $GITLEAKS_IMAGE
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"                       # scan the whole history, not just the tip
    GIT_CONFIG_COUNT: "1"                # job may run as a non-root user
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: "*"
  script:
    - gitleaks version
    - gitleaks git --config .gitleaks.toml --redact --no-banner
        --report-format sarif --report-path gitleaks.sarif .
  artifacts:
    when: always
    paths: [gitleaks.sarif]

# GitLab SAST (Semgrep for the C code); report only, does not gate the build
sast:
  stage: lint
  needs: []

build:qemux86-64:
  stage: build
  image:
    name: $KAS_IMAGE
    # Bypass the kas container entrypoint (built for `docker run`, not for
    # GitLab's shell executor) and start as root to map the build user
    entrypoint: [""]
    docker:
      user: root
  timeout: 8h
  # Every blocking gate must be green before a Yocto build starts
  needs: [lint:yaml, lint:shell, lint:dockerfile, lint:recipes, lint:kernel-hardening, secrets:gitleaks]
  # MRs that touch nothing build-relevant (docs, README, infra notes) skip the
  # Yocto build entirely; protected refs always build (cheap with warm TMPDIR)
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - meta-secure-linux/**/*
        - kas/**/*
        - ci/scripts/ci-build.sh
        - ci/scripts/cache_stats.py
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: on_success
  # Gives this job the CI variables scoped to "cache-report" (hashserv report
  # token). They are protected, so only protected main receives them; MR
  # pipelines run the same job anonymously. "prepare" = no deployment record.
  environment:
    name: cache-report
    action: prepare
  variables:
    MACHINE: qemux86-64
    BUILD_UID: "1000"     # owner of /srv/yocto/cache on the runner host
    DL_DIR: /cache/yocto/downloads
    SSTATE_DIR: /cache/yocto/sstate-cache
    KAS_WORK_DIR: /cache/yocto/ci/work
    KAS_BUILD_DIR: /cache/yocto/ci/build-qemux86-64
    # v0.3: shared read-only mirror + hashserv/prserv (docker network yocto-cache)
    KAS_FEATURES: "kas/features/local-vm.yml:kas/features/ci-mirror.yml"
  script:
    # Map the image's "builder" user to the cache owner, then drop root
    - groupmod -o -g "$BUILD_UID" "$(id -gn builder)"
    - usermod -o -u "$BUILD_UID" builder
    - chown -R builder:"$(id -gn builder)" /builder "$CI_PROJECT_DIR"
    - runuser -u builder -- env HOME=/builder ci/scripts/ci-build.sh
  artifacts:
    when: always
    expire_in: 4 weeks
    paths:
      - build.log
      - cache-stats-*.json
      - images-*.txt
      - "*.rootfs.spdx.json"
      - "*.rootfs.manifest"
    reports:
      metrics: metrics.txt

# Simulates a brand-new runner: EMPTY local DL_DIR/SSTATE_DIR, so every object
# must come from the shared read-only mirror. Manual - used for benchmarks.
build:fresh-runner:
  extends: build:qemux86-64
  variables:
    FRESH_RUNNER: "1"
    CLEAN_TMP: "1"
    DL_DIR: /cache/yocto/ci/fresh/downloads
    SSTATE_DIR: /cache/yocto/ci/fresh/sstate-cache
    KAS_BUILD_DIR: /cache/yocto/ci/build-fresh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# Maintenance (manual, main only): fetch every source of the image so git
# sources get mirror tarballs (BB_GENERATE_MIRROR_TARBALLS); the next main
# pipeline's publish:cache uploads them to the download mirror.
maintenance:fetch-all:
  extends: build:qemux86-64
  variables:
    FETCH_ALL: "1"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 4 weeks
    paths:
      - build.log
      - fetch-all.txt

# Write path of the shared cache (v0.3 step 3b). The ONLY job with mirror
# write credentials: protected default branch, trusted runner, credentials
# scoped to environment "cache-publish" (every publish is a deployment in
# Operate > Environments = audit trail), one publisher at a time.
publish:cache:
  stage: publish
  image:
    name: $RCLONE_IMAGE
    entrypoint: [""]
  needs:
    - job: build:qemux86-64
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
  environment:
    name: cache-publish
    deployment_tier: other
  resource_group: cache-publish
  interruptible: false
  script:
    - sh ci/scripts/publish-cache.sh
  artifacts:
    when: always
    expire_in: 4 weeks
    paths:
      - publish-*.log
    reports:
      metrics: metrics.txt
