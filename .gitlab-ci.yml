# =============================================================================
# Secure Linux Platform - CI backbone (milestone v0.2)
#
# Runs on the self-hosted runner tagged `yocto` (Ubuntu build VM).
# Persistent caches on the runner host (/srv/yocto/cache -> /cache/yocto):
#   downloads/    DL_DIR      (fetched sources, Yocto mirror first)
#   sstate-cache/ SSTATE_DIR  (shared state + hash-equivalence DB)
#   ci/           kas work dir (layer checkouts) and build dirs
#
# The complete target pipeline (lint, security gates, signing, release)
# lives in ci/target-pipeline.gitlab-ci.yml and is enabled per milestone.
# =============================================================================

stages:
  - lint
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true
  tags: [yocto]

variables:
  KAS_IMAGE: "ghcr.io/siemens/kas/kas:5.5"

lint:yaml:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --quiet --no-cache-dir yamllint
    - yamllint -c .yamllint kas/ .gitlab-ci.yml

build:qemux86-64:
  stage: build
  image: $KAS_IMAGE
  timeout: 8h
  needs: [lint:yaml]
  variables:
    MACHINE: qemux86-64
    # kas image entrypoint runs bitbake as user "builder" with this uid/gid,
    # matching the owner of the persistent cache on the runner host
    USER_ID: "1000"
    GROUP_ID: "1000"
    DL_DIR: /cache/yocto/downloads
    SSTATE_DIR: /cache/yocto/sstate-cache
    KAS_WORK_DIR: /cache/yocto/ci/work
    KAS_BUILD_DIR: /cache/yocto/ci/build-qemux86-64
  script:
    - set -o pipefail
    - mkdir -p "$KAS_WORK_DIR"
    # Fresh tmp every run: the image is always assembled from sstate, never
    # from leftovers of a previous job (reproducible, measurable)
    - rm -rf "$KAS_BUILD_DIR/tmp"
    - kas build "$CI_PROJECT_DIR/kas/machines/${MACHINE}.yml:$CI_PROJECT_DIR/kas/features/local-vm.yml" 2>&1 | tee build.log
    - python3 ci/scripts/cache_stats.py build.log --machine "$MACHINE" --metrics metrics.txt --json "cache-stats-${MACHINE}.json"
    - DEPLOY="$KAS_BUILD_DIR/tmp/deploy/images/$MACHINE"
    - ls -lh "$DEPLOY" | tee "images-${MACHINE}.txt"
    - cp -L "$DEPLOY/secure-linux-image-${MACHINE}.rootfs.spdx.json" .
    - cp -L "$DEPLOY/secure-linux-image-${MACHINE}.rootfs.manifest" . || true
  artifacts:
    when: always
    expire_in: 4 weeks
    paths:
      - build.log
      - cache-stats-*.json
      - images-*.txt
      - "*.rootfs.spdx.json"
      - "*.rootfs.manifest"
    reports:
      metrics: metrics.txt
