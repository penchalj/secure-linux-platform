# =============================================================================
# Secure Linux Platform - hardened reference distro for connected embedded devices
# Mapped to EU Cyber Resilience Act (CRA) Annex I essential requirements:
# see docs/CRA-COMPLIANCE.md for the traceability matrix.
# =============================================================================
require conf/distro/poky.conf

DISTRO = "secure-linux"
DISTRO_NAME = "Secure Linux Platform"
DISTRO_VERSION = "1.0.0"
DISTRO_CODENAME = "bastion"
MAINTAINER = "Secure Linux Platform maintainers <security@example.org>"

# --- Init + base features ----------------------------------------------------
INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " systemd usrmerge seccomp pam security"
DISTRO_FEATURES:remove = "x11 wayland opengl vulkan bluetooth 3g nfc pcmcia"

# --- Compiler/linker hardening (CRA Annex I 1(2)(d),(j)) ---------------------

# --- Reproducible builds (bit-identical artefacts => verifiable provenance) --

# --- Secure defaults (CRA Annex I 1(2)(b): secure by default configuration) --
# No root login, no empty passwords; image-level checks in secure-linux-image.bb
EXTRA_IMAGE_FEATURES:remove = "debug-tweaks"

# Kernel hardening fragment from meta-secure-linux
KERNEL_FEATURES:append = " features/secure-linux/hardening.scc"

