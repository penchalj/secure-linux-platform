# Read-only HTTP proxy in front of MinIO buckets.
# sstate.example.internal    -> bucket secure-linux-sstate
# downloads.example.internal -> bucket secure-linux-downloads
proxy_cache_path /var/cache/nginx/sstate levels=1:2 keys_zone=sstate:50m
                 max_size=50g inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name sstate.example.internal;
    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://minio:9000/secure-linux-sstate/;
        proxy_cache sstate;
        proxy_cache_valid 200 7d;     # sstate objects are immutable (content-addressed)
        proxy_cache_valid 404 1m;     # misses must not stick around
        add_header X-Cache-Status $upstream_cache_status;
    }
}

server {
    listen 80;
    server_name downloads.example.internal;
    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://minio:9000/secure-linux-downloads/;
        proxy_cache sstate;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
    }
}
