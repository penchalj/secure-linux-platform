# =============================================================================
# Shared Yocto cache services for a self-hosted GitLab runner fleet.
#   hashserv : bitbake hash equivalence server (L3)
#   prserv   : package revision server (L4)
#   minio    : S3-compatible store for sstate + download mirrors (L1/L2)
#   nginx    : read-only HTTP front for SSTATE_MIRRORS / PREMIRRORS
# Start:  docker compose -f infra/docker-compose.yml up -d
# =============================================================================
name: secure-linux-cache

x-bitbake: &bitbake
  image: ${BUILDER_IMAGE:-registry.example.internal/secure-linux/builder:latest}
  restart: unless-stopped
  user: "1000:1000"
  working_dir: /srv
  # bitbake sources are taken from the pinned layer checkout
  volumes:
    - ${BITBAKE_DIR:-./bitbake}:/opt/bitbake:ro

services:
  hashserv:
    <<: *bitbake
    command: >
      /opt/bitbake/bin/bitbake-hashserv
        --bind 0.0.0.0:8686
        --database /srv/data/hashserv.db
        --log INFO
    volumes:
      - ${BITBAKE_DIR:-./bitbake}:/opt/bitbake:ro
      - hashserv-data:/srv/data
    ports: ["8686:8686"]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8686"]
      interval: 30s

  prserv:
    <<: *bitbake
    # bitbake-prserv daemonises; keep the container alive by following its log
    command: >
      sh -c "/opt/bitbake/bin/bitbake-prserv --start --host 0.0.0.0 --port 8585
             --file /srv/data/prserv.sqlite3 --log /srv/data/prserv.log
             && exec tail -F /srv/data/prserv.log"
    volumes:
      - ${BITBAKE_DIR:-./bitbake}:/opt/bitbake:ro
      - prserv-data:/srv/data
    ports: ["8585:8585"]

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes: [minio-data:/data]
    ports: ["9000:9000", "9001:9001"]

  # Anonymous, read-only HTTP for build consumers (no credentials in MRs)
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on: [minio]
    volumes:
      - ./nginx/sstate.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]

volumes:
  hashserv-data:
  prserv-data:
  minio-data:
