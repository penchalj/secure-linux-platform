# Same tools and versions as the CI lint stage (v0.4). Install: pipx install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks: [{ id: gitleaks }]
  - repo: https://github.com/priv-kweihmann/oelint-adv
    rev: 8.2.2
    hooks: [{ id: oelint-adv, args: ["--release=latest", "--quiet"] }]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks: [{ id: shellcheck, args: ["--severity=warning", "-x"] }]
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks: [{ id: hadolint-docker }]
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks: [{ id: yamllint, args: ["-c", ".yamllint"] }]
