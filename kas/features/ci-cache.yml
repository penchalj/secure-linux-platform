# =============================================================================
# CI cache overlay - layered caching strategy (see docs/CACHING.md)
#
#   L1  DL_DIR      -> GitLab cache (keyed on kas lock file) + PREMIRROR on S3
#   L2  SSTATE_DIR  -> local runner volume (persistent) + SSTATE_MIRRORS on S3
#   L3  Hash equiv  -> shared bitbake-hashserv (reuses sstate across hash changes)
#   L4  PR service  -> shared bitbake-prserv (monotonic package revisions)
#
# kas exports every key under `env:` into bitbake's environment
# (BB_ENV_PASSTHROUGH_ADDITIONS); CI/CD variables override the defaults.
# All endpoints come from CI/CD variables so the same file works on
# self-hosted runners (NFS/MinIO) and on cloud runners (S3 + CloudFront).
# Untrusted MR pipelines get READ-ONLY mirrors; only protected branches
# publish sstate (cache-poisoning protection, see ci/templates/cache.yml).
# =============================================================================
header:
  version: 18

env:
  SSTATE_MIRROR_URL: "https://sstate.example.internal"
  DL_MIRROR_URL: "https://downloads.example.internal"
  HASHSERV_URL: "hashserv.example.internal:8686"
  PRSERV_URL: "prserv.example.internal:8585"
  SLP_CACHE_DIR: "/cache/yocto"
  SLP_CVE_DB_DIR: "/cache/yocto/cve-db"
  SLP_SSTATE_GPG_KEYID: ""

local_conf_header:
  10-ci-cache: |
    # --- L1: downloads -------------------------------------------------------
    DL_DIR = "${SLP_CACHE_DIR}/downloads"
    BB_GENERATE_MIRROR_TARBALLS = "1"
    BB_GIT_SHALLOW = "1"
    BB_GENERATE_SHALLOW_TARBALLS = "1"
    INHERIT += "own-mirrors"
    SOURCE_MIRROR_URL = "${DL_MIRROR_URL}"

    # --- L2: shared state ----------------------------------------------------
    SSTATE_DIR = "${SLP_CACHE_DIR}/sstate-cache"
    SSTATE_MIRRORS ?= "file://.* ${SSTATE_MIRROR_URL}/PATH;downloadfilename=PATH"
    # Parallel sstate fetch - big win on cold runners
    BB_NUMBER_THREADS_SSTATE ?= "16"
    # Every consumer verifies sstate signatures (see sstate-sign.yml for producer)
    SSTATE_VERIFY_SIG = "1"
    SSTATE_VALID_SIGS = "${SLP_SSTATE_GPG_KEYID}"

    # --- L3: hash equivalence -------------------------------------------------
    BB_SIGNATURE_HANDLER = "OEEquivHash"
    BB_HASHSERVE = "auto"
    BB_HASHSERVE_UPSTREAM = "${HASHSERV_URL}"
    BB_HASHSERVE_DB_DIR = "${SSTATE_DIR}"

    # --- L4: package revision service ----------------------------------------
    PRSERV_HOST = "${PRSERV_URL}"

    # --- CVE database: refreshed once nightly, never fetched by builds ------
    CVE_CHECK_DB_DIR = "${SLP_CVE_DB_DIR}"
    CVE_DB_UPDATE_INTERVAL = "-1"

